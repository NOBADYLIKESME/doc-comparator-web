spring.application.name=doc-comparator-web

# 服务器端口
server.port=8080

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/,file:../build/
spring.mvc.static-path-pattern=/** 

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# 临时文件目录
upload.dir=uploads/
output.dir=outputs/

# 文件清理配置（24小时）
file.cleanup.interval=86400000

# Aspose.Words 许可证配置（如果需要）
# aspose.words.license.path=classpath:aspose-words-license.xml

# 日志配置
logging.level.root=INFO
logging.level.group.haite.report.doccomparatorweb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n